services:
  image-randomizer-be-lint:
    container_name: image-randomizer-be-lint
    image: golangci/golangci-lint:v2.15.0
    working_dir: /image-randomizer
    command: make lint
    environment:
      - GOFLAGS=-mod=vendor
    volumes:
      - ../:/image-randomizer:ro
      - go-mod-cache:/go/pkg/mod
    profiles:
      - lint

volumes:
  go-mod-cache:
