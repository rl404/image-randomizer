name: build fe

on:
  pull_request:
    paths:
      - "frontend/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - run: ls
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
